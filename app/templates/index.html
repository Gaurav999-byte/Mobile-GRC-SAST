<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mobile GRC – APK Security Scanner</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #e2e8f0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #60a5fa;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(96,165,250,0.4);
        }

        .subtitle {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 50px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            padding: 45px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            transition: 0.3s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 35px rgba(0,0,0,0.55);
        }

        .upload-label {
            display: inline-block;
            background: #3b82f6;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.2s;
            color: #fff;
            box-shadow: 0 4px 18px rgba(59,130,246,0.35);
        }

        .upload-label:hover {
            background: #2563eb;
            box-shadow: 0 6px 22px rgba(37,99,235,0.45);
        }

        input[type="file"] {
            display: none;
        }

        .scan-btn {
            padding: 14px 34px;
            background: #10b981;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 18px rgba(16,185,129,0.35);
        }
        .scan-btn:hover {
            background: #059669;
            box-shadow: 0 6px 22px rgba(5,150,105,0.45);
        }

        .scan-btn:active {
            background: #047857;
        }

        .footer {
            margin-top: 60px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🔐 Mobile GRC Security Scanner</div>
        <div class="subtitle">Vulnerability & Risk Analysis</div>

        <div class="card">
            <form action="/scan" method="post" enctype="multipart/form-data">

                <label class="upload-label">
                    📁 Select APK File
                    <input type="file" name="file" accept=".apk" required />
                </label>

                <br>

                <button type="submit" class="scan-btn">🚀 Start Scan</button>
            </form>
        </div>

        <div class="footer">
            © 2026 Mobile GRC — Automated Android Security & Compliance Auditing
        </div>

    </div>

</body>
</html>
