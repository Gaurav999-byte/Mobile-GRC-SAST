<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  font-family: Helvetica;
  font-size: 12px;
}

h1 {
  text-align: center;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #000;
  padding: 6px;
}

th {
  background: #ddd;
}

.summary-table {
  margin-top: 10px;
}

img {
  width: 300px;
  display: block;
  margin: 10px auto;
}
</style>
</head>

<body>

<h1>Mobile Security Report</h1>
<p><b>APK:</b> {{APK_NAME}}</p>
<h2>Severity Summary</h2>

<table class="summary-table">
  <tr>
    <th>High</th>
    <th>Medium</th>
    <th>Low</th>
  </tr>
  <tr>
    <td>{{HIGH_COUNT}}</td>
    <td>{{MEDIUM_COUNT}}</td>
    <td>{{LOW_COUNT}}</td>
  </tr>
</table>

{% if CHART_PATH %}
<img src="{{CHART_PATH}}" />
{% endif %}

<h2>Findings</h2>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Issue</th>
      <th>Severity</th>
      <th>Evidence</th>
      <th>ISO27001</th>
      <th>GDPR</th>
      <th>OWASP</th>
      <th>Recommendation</th>
    </tr>
  </thead>
  <tbody>
    {{FINDINGS_ROWS}}
  </tbody>
</table>

</body>
</html>
